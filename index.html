<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALIOU TV FOOTBALL</title>

  <!-- ⚡ Accélération réseau -->
  <link rel="preconnect" href="https://1.yallaasshoot.cc">
  <link rel="dns-prefetch" href="//1.yallaasshoot.cc">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #00ffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 12px 0;
      font-size: 20px;
    }

    .player-wrapper {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      top: -30%;
      left: -15%;
      width: 130%;
      height: 170%;
      border: none;
    }

    button {
      margin-top: 10px;
      background: #00ffff;
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .warn {
      font-size: 12px;
      color: #ffae00;
      margin: 8px;
    }

    /* 📱 Mobile ultra léger */
    @media (max-width: 768px) {
      iframe {
        top: -28%;
        left: -18%;
        width: 135%;
        height: 165%;
      }
    }

    /* 🔥 Mode plein écran interne */
    .fullscreen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
    }

    .fullscreen .iframe-container {
      height: 100vh;
      aspect-ratio: auto;
    }
  </style>
</head>

<body>

  <div class="player-wrapper" id="player">

    <h1>⚽ ALIOU TV FOOTBALL</h1>

    <div class="iframe-container">
      <!-- ⚡ Chargement différé -->
      <iframe
        id="streamFrame"
        src="about:blank"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen="true">
      </iframe>
    </div>

    <!-- 🎮 Contrôles -->
    <button onclick="loadStream()">▶ Lancer le direct</button>
    <button onclick="toggleFullscreen()">⛶ Plein écran</button>

    <div class="warn">
      🔒 Si une pub s’ouvre, revenez simplement sur la page vidéo.
    </div>

  </div>

  <script>
    function loadStream() {
      const iframe = document.getElementById("streamFrame");

      // charge seulement au clic (important pour réseau faible)
      if (iframe.src === "about:blank") {
        iframe.src = "https://8.wwwkora.com/albaplayer/bein-sports-hd-1";
      }
    }

    function toggleFullscreen() {
      const player = document.getElementById("player");
      player.classList.toggle("fullscreen");
    }
  </script>

</body>
</html>
