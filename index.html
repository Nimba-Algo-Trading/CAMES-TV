<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALIOU TV FOOTBALL</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #00ffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 15px 0;
      font-size: 22px;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      margin: auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffff33;
      border: 2px solid #00ffff55;
      background: #000;
    }

    iframe {
      position: absolute;
      top: -30%;     /* 🔥 coupe fortement le haut */
      left: -15%;    /* coupe côtés */
      width: 130%;   /* zoom */
      height: 170%;  /* 🔥 coupe bas + zoom */
      border: none;
    }

    .warn {
      font-size: 13px;
      color: #ffae00;
      margin: 10px;
    }
  </style>
</head>

<body>

  <h1>⚽ ALIOU TV FOOTBALL</h1>

  <div class="iframe-container">
    <iframe
      src="https://1.yallaasshoot.cc/ch8.html"
      allow="autoplay; encrypted-media"
      allowfullscreen="true">
    </iframe>
  </div>

  <div class="warn">
    🔒 Si une pub s’ouvre, revenez simplement sur la page vidéo.
  </div>

</body>
</html>
