<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALIOU TV FOOTBALL</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #00ffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 15px 0;
      font-size: 22px;
    }

    .player-wrapper {
      width: 95%;
      max-width: 1000px;
      margin: auto;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffff33;
      border: 2px solid #00ffff55;
      background: #000;
    }

    iframe {
      position: absolute;
      top: -30%;
      left: -15%;
      width: 130%;
      height: 170%;
      border: none;
      background: #000;
    }

    .controls {
      margin: 10px 0;
    }

    button {
      background: #00ffff;
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .warn {
      font-size: 13px;
      color: #ffae00;
      margin: 10px;
    }

    /* Mode plein écran interne */
    .fullscreen-mode {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      z-index: 9999;
      background: #000;
      padding: 0;
    }

    .fullscreen-mode .iframe-container {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
      border: none;
    }

    .fullscreen-mode iframe {
      top: -30%;
      left: -15%;
      width: 130%;
      height: 170%;
    }

    .fullscreen-mode .controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10000;
    }

    .fullscreen-mode h1,
    .fullscreen-mode .warn {
      display: none;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 18px;
      }

      .player-wrapper {
        width: 100%;
      }

      .iframe-container {
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      iframe {
        top: -28%;
        left: -18%;
        width: 136%;
        height: 165%;
      }
    }
  </style>
</head>

<body>

  <div class="player-wrapper" id="playerWrapper">
    <h1>⚽ ALIOU TV FOOTBALL</h1>

    <div class="iframe-container">
      <iframe
        src="https://1.yallaasshoot.cc/ch8.html"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen="true">
      </iframe>
    </div>

    <div class="controls">
      <button onclick="toggleFullscreen()" id="fullscreenBtn">
        ⛶ Plein écran
      </button>
    </div>

    <div class="warn">
      🔒 Si une pub s’ouvre, revenez simplement sur la page vidéo.
    </div>
  </div>

  <script>
    const playerWrapper = document.getElementById("playerWrapper");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    function toggleFullscreen() {
      playerWrapper.classList.toggle("fullscreen-mode");

      if (playerWrapper.classList.contains("fullscreen-mode")) {
        fullscreenBtn.innerText = "↙ Mode réduit";
        screen.orientation?.lock?.("landscape").catch(() => {});
      } else {
        fullscreenBtn.innerText = "⛶ Plein écran";
        screen.orientation?.unlock?.();
      }
    }
  </script>

</body>
</html>
